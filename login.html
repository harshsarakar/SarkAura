<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SarkAura Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            background: #111;
            border: 1px solid #333;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1b1b1b;
            color: #fff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .signup a {
            color: #8b5cf6;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            <span>S</span>arkAura
        </div>

        <p class="subtitle">
            Login to your account
        </p>

        <input
    type="email"
    id="loginEmail"
    placeholder="Email address"
        >

        <input
    type="password"
    id="loginPassword"
    placeholder="Password"
>

        <button id="loginBtn">
    Login
        </button>

        <p class="signup">
            Don't have an account?
            <a href="#" id="signupBtn">Sign Up</a>
        </p>

    </div>
    
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
  </html>
