<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SarkAura Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            background: #111;
            border: 1px solid #333;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #8b5cf6;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #1b1b1b;
            color: #fff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup {
            text-align: center;
            margin-top: 20px;
            color: #aaa;
        }

        .signup a {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border-radius: 10px;
    background: #8b5cf6;
    color: #fff;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
        }

        .popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
}

.popup-box {
    width: 100%;
    max-width: 350px;
    background: #111;
    border: 1px solid #333;
    border-radius: 18px;
    padding: 28px;
    text-align: center;
}

.popup-icon {
    width: 55px;
    height: 55px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: #8b5cf6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: bold;
}

.popup-box h3 {
    margin-bottom: 10px;
}

.popup-box p {
    color: #aaa;
    margin-bottom: 20px;
    line-height: 1.5;
}

.popup-box button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #8b5cf6;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            <span>S</span>arkAura
        </div>

        <p class="subtitle">
            Login to your account
        </p>

        <input
    type="email"
    id="loginEmail"
    placeholder="Email address"
        >

        <input
    type="password"
    id="loginPassword"
    placeholder="Password"
>

        <button id="loginBtn">
    Login
        </button>

        <p class="signup">
            Don't have an account?
            <a href="#" id="signupBtn">Sign Up</a>
        </p>

    </div>

    <div class="popup" id="popup">
    <div class="popup-box">
        <div class="popup-icon">✓</div>

        <h3 id="popupTitle">Notice</h3>

        <p id="popupMessage"></p>

        <button id="popupBtn">OK</button>
    </div>
                                    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

const SUPABASE_URL = "https://xikxviwdkfccfkebdwye.supabase.co";

const SUPABASE_KEY = "sb_publishable_eZD2D4vPSDcFYZo8es-vWA_3zZEcwC_";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
        function showPopup(message) {

    const popup =
        document.getElementById("popup");

    const popupMessage =
        document.getElementById("popupMessage");

    const popupBtn =
        document.getElementById("popupBtn");

    if (!popup || !popupMessage || !popupBtn) {
        return;
    }

    popupMessage.textContent = message;

    popup.style.display = "flex";

    popupBtn.onclick = function () {
        popup.style.display = "none";
    };
        }
        const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", async function () {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if (!email || !password) {
        showPopup("Please enter email and password.");
        return;
    }

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

    if (error) {
        showPopup(error.message);
        return;
    }

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", data.user.id)
            .single();

    if (profileError || !profile) {
    showPopup(
        "Profile Error: " +
        (profileError ? profileError.message : "Profile not found")
    );
    console.error("Profile error:", profileError);
    return;
        }

    sessionStorage.setItem("loginSuccess", "true");

    if (profile.role === "admin") {
        window.location.href = "admin.html";
    } else {
        window.location.href = "index.html";
    }

});

        const signupBtn = document.getElementById("signupBtn");

signupBtn.addEventListener("click", async function (event) {

    event.preventDefault();

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    if (!email || !password) {
        showPopup("Please enter email and password.");
        return;
    }

    const { error } =
        await supabaseClient.auth.signUp({
            email: email,
            password: password
        });

    if (error) {
        showPopup(error.message);
        return;
    }

    showPopup("Account created successfully! Please login.");

});

    </script>
</body>
  </html>
