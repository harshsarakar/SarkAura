<!DOCTYPE html>
<html lang="en">

<script>
const SUPABASE_URL = "https://xikxviwdkfccfkebdwye.supabase.co";

const SUPABASE_KEY = "sb_publishable_eZD2D4vPSDcFYZo8es-vWA_3zZEcwC_";

const supabaseClient = supabase.createClient(

</script>
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        * {

        body {

        .admin-header {

            justify-content: space-between;

        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
            padding: 35px 0;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #999;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .card {
            background: #111118;
            border: 1px solid #24242d;
            border-radius: 16px;
            padding: 22px;
        }

        .card-icon {

            margin-bottom: 15px;
        }

        .card-title {
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 26px;

        }

        .section {

        }

        }

            background: #111118;

        }

            padding: 35px 10px;
        }

        @media (max-width: 800px) {

                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <header class="admin-header">

        <div class="logo">
            <span>S</span>arkAura
        </div>

        <div class="admin-badge">
            ADMIN PANEL
        </div>

    </header>


    <main class="container">

        <div class="welcome">

            <h1>
                Dashboard 👋
            </h1>

            <p>
                SarkAura administration panel
            </p>

        </div>


        <div class="dashboard-grid">

            <div class="card">

                <div class="card-icon">
                    👥
                </div>

                <div class="card-title">
                    Total Users
                </div>

                <div class="card-value" id="totalUsers">
                    0
                </div>

            </div>


            <div class="card">

                <div class="card-icon">
                    📦
                </div>

                <div class="card-title">
                    Total Orders
                </div>

                <div class="card-value" id="totalOrders">
                    0
                </div>

            </div>


            <div class="card">

                <div class="card-icon">
                    💳
                </div>

                <div class="card-title">
                    Pending Deposits
                </div>

                <div class="card-value" id="pendingDeposits">
                    0
                </div>

            </div>


            <div class="card">

                <div class="card-icon">
                    💰
                </div>

                <div class="card-title">
                    Total Balance
                </div>

                <div class="card-value">
                    ₹<span id="totalBalance">0.00</span>
                </div>

            </div>

        </div>


        <div class="section">

            <h2>
                Admin Controls
            </h2>

            <div class="panel">

                <div id="depositList">

    <p style="color:#999;text-align:center;">
        Loading deposits...
    </p>

                </div>

            </div>

        </div>

        <div class="section">

    <h2>
        📦 Order Management
    </h2>

    <div class="panel">

        <div id="orderList">

            <p style="color:#999;text-align:center;">
                Loading orders...
            </p>

        </div>

    </div>

        </div>

    </main>
    
<script>
    async function loadAdminStats() {

    const { data, error } =
        await supabaseClient.rpc("get_admin_stats");

    if (error) {
        console.error("Admin stats error:", error);
        return;
    }

    const stats = data;

    document.getElementById("totalUsers").textContent =
        stats.total_users;

    document.getElementById("totalOrders").textContent =
        stats.total_orders;

    document.getElementById("pendingDeposits").textContent =
        stats.pending_deposits;

    document.getElementById("totalBalance").textContent =
        Number(stats.total_balance).toFixed(2);
}

loadAdminStats();
async function loadDeposits() {

    const depositList =
        document.getElementById("depositList");

    if (!depositList) return;

    const { data, error } =
        await supabaseClient
            .from("deposits")
            .select("*")
            .eq("status", "pending")
            .order("created_at", {
                ascending: false
            });

    if (error) {

        depositList.innerHTML =
            "<p style='color:#ff6b6b;text-align:center;'>" +
            error.message +
            "</p>";

        return;
    }

    if (!data || data.length === 0) {

        depositList.innerHTML =
            "<p style='color:#999;text-align:center;'>" +
            "No pending deposits." +
            "</p>";

        return;
    }

    depositList.innerHTML =
        data.map(function (deposit) {

            return `
                <div style="
                    border:1px solid #24242d;
                    border-radius:12px;
                    padding:18px;
                    margin-bottom:12px;
                ">

                    <div style="margin-bottom:8px;">
                        <strong>💳 ₹${Number(deposit.amount).toFixed(2)}</strong>
                    </div>

                    <div style="
                        color:#999;
                        font-size:13px;
                        word-break:break-all;
                    ">
                        User ID: ${deposit.user_id}
                    </div>

                    <div style="
                        color:#999;
                        font-size:13px;
                        margin-top:5px;
                    ">
                        Reference: ${deposit.payment_reference || "-"}
                    </div>

                    <div style="margin-top:14px;">

                        <button
                            onclick="approveDeposit('${deposit.id}')"
                            style="
                                padding:10px 16px;
                                border:0;
                                border-radius:8px;
                                cursor:pointer;
                                margin-right:8px;
                            ">
                            ✅ Approve
                        </button>

                        <button
                            onclick="rejectDeposit('${deposit.id}')"
                            style="
                                padding:10px 16px;
                                border:0;
                                border-radius:8px;
                                cursor:pointer;
                            ">
                            ❌ Reject
                        </button>

                    </div>

                </div>
            `;

        }).join("");
}

loadDeposits();
    async function approveDeposit(depositId) {

    const { data: deposit, error: depositError } =
        await supabaseClient
            .from("deposits")
            .select("*")
            .eq("id", depositId)
            .single();

    if (depositError || !deposit) {
        alert("Deposit not found.");
        return;
    }

    if (deposit.status !== "pending") {
        alert("This deposit is already processed.");
        return;
    }

    const { data: profile, error: profileError } =
        await supabaseClient
            .from("profiles")
            .select("balance")
            .eq("id", deposit.user_id)
            .single();

    if (profileError || !profile) {
        alert("User profile not found.");
        return;
    }

    const newBalance =
        Number(profile.balance || 0) +
        Number(deposit.amount);

    const { error: balanceError } =
        await supabaseClient
            .from("profiles")
            .update({
                balance: newBalance
            })
            .eq("id", deposit.user_id);

    if (balanceError) {
        alert(balanceError.message);
        return;
    }

    const { error: statusError } =
        await supabaseClient
            .from("deposits")
            .update({
                status: "approved"
            })
            .eq("id", depositId);

    if (statusError) {
        alert(statusError.message);
        return;
    }

    alert("Deposit approved successfully.");

    loadDeposits();
        }

    async function rejectDeposit(depositId) {

    const { data: deposit, error: depositError } =
        await supabaseClient
            .from("deposits")
            .select("*")
            .eq("id", depositId)
            .single();

    if (depositError || !deposit) {
        alert("Deposit not found.");
        return;
    }

    if (deposit.status !== "pending") {
        alert("This deposit is already processed.");
        return;
    }

    const { error: statusError } =
        await supabaseClient
            .from("deposits")
            .update({
                status: "rejected"
            })
            .eq("id", depositId)
            .eq("status", "pending");

    if (statusError) {
        alert(statusError.message);
        return;
    }

    alert("Deposit rejected successfully.");

    loadDeposits();
           }

        // ================================
    // ORDER MANAGEMENT
    // ================================

    async function loadOrders() {

        const orderList =
            document.getElementById("orderList");

        if (!orderList) return;

        const { data, error } =
            await supabaseClient
                .from("orders")
                .select("*")
                .order("created_at", {
                    ascending: false
                });

        if (error) {

            orderList.innerHTML =
                "<p style='color:#ff6b6b;text-align:center;'>" +
                error.message +
                "</p>";

            return;
        }

        if (!data || data.length === 0) {

            orderList.innerHTML =
                "<p style='color:#999;text-align:center;'>" +
                "No orders found." +
                "</p>";

            return;
        }

        const ordersWithEmail = await Promise.all(
    data.map(async function (order) {

        const { data: email } =
            await supabaseClient.rpc(
                "get_user_email",
                {
                    p_user_id: order.user_id
                }
            );

        return {
            ...order,
            user_email: email || "-"
        };

    })
);

orderList.innerHTML =
    ordersWithEmail.map(function (order) {

                return `
                    <div style="
                        border:1px solid #24242d;
                        border-radius:12px;
                        padding:18px;
                        margin-bottom:12px;
                    ">

                        <div style="margin-bottom:8px;">
                            <strong>
                                📦 ${order.service_name}
                            </strong>
                        </div>

                        <div style="
                            color:#999;
                            font-size:13px;
                            margin-top:5px;
                        ">
                            Order ID: ${order.id}
                        </div>

                        <div style="
                            color:#999;
                            font-size:13px;
                            margin-top:5px;
                            word-break:break-all;
                        ">
                            User ID: ${order.user_id}
                        </div>

                        <div style="
                            color:#999;
                            font-size:13px;
                            margin-top:5px;
                            word-break:break-all;
                        ">
                            Link: ${order.link}
                        </div>

                        <div style="
                            color:#999;
                            font-size:13px;
                            margin-top:5px;
                        ">
                            Quantity: ${order.quantity}
                        </div>

                        <div style="
                            color:#999;
                            font-size:13px;
                            margin-top:5px;
                        ">
                            Amount: ₹${Number(order.amount).toFixed(2)}
                        </div>

                        <div style="
                            margin-top:8px;
                            font-size:14px;
                        ">
                            Status:
                            <strong>${order.status}</strong>
                        </div>

    <div style="
    color:#999;
    font-size:13px;
    margin-top:5px;
">
    🕒 Time: ${
        order.created_at
            ? new Date(order.created_at).toLocaleString("en-IN")
            : "-"
    }
</div>

                        <div style="margin-top:14px;">

                            <button
                                onclick="updateOrderStatus(${order.id}, 'processing')"
                                style="
                                    padding:10px 14px;
                                    border:0;
                                    border-radius:8px;
                                    cursor:pointer;
                                    margin-right:6px;
                                ">
                                ⚙️ Processing
                            </button>

                            <button
                                onclick="updateOrderStatus(${order.id}, 'completed')"
                                style="
                                    padding:10px 14px;
                                    border:0;
                                    border-radius:8px;
                                    cursor:pointer;
                                    margin-right:6px;
                                ">
                                ✅ Complete
                            </button>

                            <button
                                onclick="updateOrderStatus(${order.id}, 'cancelled')"
                                style="
                                    padding:10px 14px;
                                    border:0;
                                    border-radius:8px;
                                    cursor:pointer;
                                ">
                                ❌ Cancel
                            </button>

                        </div>

                    </div>
                `;

            }).join("");
    }


    async function updateOrderStatus(orderId, newStatus) {

        const { error } =
            await supabaseClient
                .from("orders")
                .update({
                    status: newStatus
                })
                .eq("id", orderId);

        if (error) {

            alert(
                "Order update failed: " +
                error.message
            );

            return;
        }

        alert(
            "Order status updated to " +
            newStatus
        );

        loadOrders();
    }


    loadOrders();
           </script>

</body>

  </html>
