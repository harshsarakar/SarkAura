<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SarkAura Admin Panel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08080d;
            color: white;
            min-height: 100vh;
        }

        .admin-header {
            padding: 20px;
            border-bottom: 1px solid #24242d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #a855f7;
        }

        .admin-badge {
            background: #17171f;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #c084fc;
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
            padding: 35px 0;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #999;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .card {
            background: #111118;
            border: 1px solid #24242d;
            border-radius: 16px;
            padding: 22px;
        }

        .card-icon {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .card-title {
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 26px;
            font-weight: bold;
        }

        .section {
            margin-top: 30px;
        }

        .section h2 {
            margin-bottom: 15px;
        }

        .panel {
            background: #111118;
            border: 1px solid #24242d;
            border-radius: 16px;
            padding: 25px;
        }

        .coming {
            color: #999;
            text-align: center;
            padding: 35px 10px;
        }

        @media (max-width: 800px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 26px;

                    👥
                </div>

                <div class="card-title">
                    Total Users

                    0
                </div>

            </div>


            <div class="card">

                <div class="card-icon">
                    📦
                </div>

                </div>
